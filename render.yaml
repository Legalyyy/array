services:
  - type: web
    name: discord-trading-bot
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run db:push -- --force && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: discord-bot-db
          property: connectionString
    healthCheckPath: /api/health

databases:
  - name: discord-bot-db
    databaseName: discord_bot
    plan: free
